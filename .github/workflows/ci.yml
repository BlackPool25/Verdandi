name: ci
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  schedule: [{cron: "0 2 * * 1"}]
  workflow_dispatch: {}
permissions: {contents: read, security-events: write}
jobs:
  lint-type:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.14", cache: pip}
      - run: pip install -r requirements-ci.txt
      - run: '! grep -rn "from spike\|import spike" src/ --include="*.py"'
      - run: ruff check src/ tests/ && ruff format --check src/ tests/
      - run: mypy src/
  battery:
    runs-on: ubuntu-22.04
    needs: lint-type
    timeout-minutes: 10
    env: {PYTHONHASHSEED: "7", OMP_NUM_THREADS: "1", OPENBLAS_NUM_THREADS: "1"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.14", cache: pip}
      - run: pip install -r requirements.txt -r requirements-ci.txt
      - run: python -m pytest tests/ -m "k1 or k2 or k3 or k4 or k5 or battery" --junitxml=junit.xml --cov=src --cov-fail-under=80 -q -n auto
      - run: python scripts/check_gates.py --csv artifacts/battery.csv --f1 0.85 --ac1 0.70 --flip 0.40 --ground 0.95 --max-s 600
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: traces-battery, path: "artifacts/*.jsonl\nartifacts/battery.csv\njunit.xml", retention-days: 30}
  killbars-security:
    runs-on: ubuntu-22.04
    needs: lint-type
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.14", cache: pip}
      - run: pip install -r requirements.txt
      - run: |
          PYTHONHASHSEED=7 python -m src.replay --seed 7 --out /tmp/a.jsonl
          PYTHONHASHSEED=7 python -m src.replay --seed 7 --out /tmp/b.jsonl
          diff -q /tmp/a.jsonl /tmp/b.jsonl || (echo "DIVERGE"; exit 1)
      - run: pip install bandit pip-audit
      - run: bandit -r src/ -ll -f json -o bandit.json
      - run: pip-audit -r requirements.txt -f json -o audit.json
  e2e-demo:
    runs-on: ubuntu-22.04
    needs: battery
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.14", cache: pip}
      - run: pip install -r requirements.txt
      - run: bash demo/run.sh
  adversarial:
    runs-on: ubuntu-22.04
    needs: battery
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.14", cache: pip}
      - run: pip install -r requirements.txt -r requirements-ci.txt
      - run: python -m pytest tests/ -m "adversarial or mutation" -q
  docs-links:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: '! grep -rnE "VETO_M5|6/6 machines|TODO\(owner\)" docs/SRS.md docs/SDD.md docs/SIM_SPEC.md docs/TEST_PLAN.md docs/TEST_CASES.md docs/CHARTER.md docs/REGISTERS.md docs/SPRINT_PACK.md docs/BACKLOG_DETAIL.md src/ README.md'
      - uses: lycheeverse/lychee-action@v2
        with: {args: "docs/**/*.md README.md"}
  notify:
    runs-on: ubuntu-22.04
    needs: [battery, killbars-security, e2e-demo, adversarial, docs-links]
    if: always()
    steps:
      - run: ./scripts/linear_update.sh "${{ needs.battery.result }}"
        env: {LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}}
