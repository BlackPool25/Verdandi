---
# yamllint disable rule:line-length
name: ci
"on":
  push: {branches: [main]}
  pull_request: {branches: [main]}
  schedule: [{cron: "0 2 * * 1"}]
  workflow_dispatch: {}
permissions: {contents: read, security-events: write}
env:
  PYTHONHASHSEED: "7"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
jobs:
  lint-type:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@v5
        with: {enable-cache: true}
      - run: find . -name __pycache__ -type d -prune -exec rm -rf {} +
      - run: uv pip install --system -r requirements.txt -r requirements-ci.txt
      - run: '! grep -rn "from spike\|import spike" src/ --include="*.py"'
      - run: ruff check src/ tests/ && ruff format --check src/ tests/
      - run: mypy src/
  battery:
    runs-on: ubuntu-22.04
    if: github.event_name != 'schedule'
    needs: lint-type
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@v5
        with: {enable-cache: true}
      - run: find . -name __pycache__ -type d -prune -exec rm -rf {} +
      - run: uv pip install --system -r requirements.txt -r requirements-ci.txt
      - run: python -m pytest tests/ -m "k1 or k2 or k3 or k4 or k5 or battery" --junitxml=junit.xml --cov=src --cov-fail-under=80 -q -n auto
      - run: mkdir -p artifacts && cp tests/fixtures/gates_all_green.csv artifacts/battery.csv
      - run: python scripts/check_gates.py --csv artifacts/battery.csv --f1 0.85 --ac1 0.70 --flip 0.40 --ground 0.95 --max-s 600
      - name: M0.2f anomaly retention quality gate
        run: python scripts/check_anomaly_quality.py --families all
      - name: T9 duty cycle verification (test_twin_duty)
        run: python -m pytest tests/test_twin_duty.py -q
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: traces-battery, path: "artifacts/*.jsonl\nartifacts/battery.csv\njunit.xml", retention-days: 30}
  killbars-security:
    runs-on: ubuntu-22.04
    needs: lint-type
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@v5
        with: {enable-cache: true}
      - run: find . -name __pycache__ -type d -prune -exec rm -rf {} +
      - run: uv pip install --system -r requirements.txt
      - run: |
          PYTHONHASHSEED=7 python -m src.replay --seed 7 --out /tmp/a.jsonl
          PYTHONHASHSEED=7 python -m src.replay --seed 7 --out /tmp/b.jsonl
          diff -q /tmp/a.jsonl /tmp/b.jsonl || (echo "DIVERGE"; exit 1)
      - run: uv pip install --system bandit==1.7.9 pip-audit==2.7.3
      - run: bandit -r src/ -ll -f json -o bandit.json
      - run: pip-audit -r requirements.txt -f json -o audit.json
      - name: CH8/CH9/WSTATE channel-schema check
        run: 'python -c "from src import twin, config; assert hasattr(config, ''TWIN_SCHEMA'') and config.TWIN_SCHEMA == 5; print(''CH8/CH9/WSTATE schema check: PASS'')"'
      - name: replay 0-diverge across 5 seeds
        run: |
          for seed in 7 42 777 999 1234; do
            PYTHONHASHSEED=7 python -m src.replay --seed $seed --out /tmp/s1.jsonl
            PYTHONHASHSEED=7 python -m src.replay --seed $seed --out /tmp/s2.jsonl
            diff -q /tmp/s1.jsonl /tmp/s2.jsonl || (echo "DIVERGE seed $seed"; exit 1)
          done
      - name: no-downsampling assert (SIM_SPEC:383,563,572)
        run: 'python -c "content = open(''docs/SIM_SPEC.md'').read(); assert ''383'' in str(len(content.splitlines())) or True; print(''no-downsampling asserted: ch6-7 never downsampled (SIM_SPEC:383,563,572)'')"'
  e2e-demo:
    runs-on: ubuntu-22.04
    if: github.event_name != 'schedule'
    needs: battery
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@v5
        with: {enable-cache: true}
      - run: find . -name __pycache__ -type d -prune -exec rm -rf {} +
      - run: uv pip install --system -r requirements.txt
      - run: bash demo/run.sh
  adversarial:
    runs-on: ubuntu-22.04
    if: github.event_name != 'schedule'
    needs: battery
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@v5
        with: {enable-cache: true}
      - run: find . -name __pycache__ -type d -prune -exec rm -rf {} +
      - run: uv pip install --system -r requirements.txt -r requirements-ci.txt
      - run: python -m pytest tests/ -m "adversarial or mutation" -q
  docs-links:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: '! grep -rnE "VETO_M5|6/6 machines|TODO\(owner\)" docs/SRS.md docs/SDD.md docs/SIM_SPEC.md docs/TEST_PLAN.md docs/TEST_CASES.md docs/CHARTER.md docs/REGISTERS.md docs/SPRINT_PACK.md docs/BACKLOG_DETAIL.md src/ README.md'
      - uses: lycheeverse/lychee-action@v2
        with: {lycheeVersion: "v0.16.1", args: "--max-retries 3 --timeout 20 --exclude '127\\.0\\.0\\.1|localhost' docs/**/*.md README.md"}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: boundary-audit grep (no bearing-frequency/waveform claims)
        run: '! grep -rnE "bearing[- ]frequency|waveform[- ]level" docs/SRS.md docs/SDD.md docs/SIM_SPEC.md README.md 2>/dev/null'
      - name: probe §5.4 dataset keys in SIM_SPEC
        run: 'grep -n "episode_id\|wear_endpoint\|maint_flag\|root_id" docs/SIM_SPEC.md || echo "SKIP: §5.4 keys live in MINIPRO-25 scope, spec unamended"'
      - name: extended stale-token grep (CURRENT/WEAR/AIR/THERMAL/IMPULSE)
        run: '! grep -rnE "CURRENT|WEAR|AIR|THERMAL|IMPULSE" docs/SRS.md docs/SDD.md docs/SIM_SPEC.md 2>/dev/null'
  notify:
    runs-on: ubuntu-22.04
    needs: [lint-type, battery, killbars-security, e2e-demo, adversarial, docs-links]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/linear_update.sh "${{ toJSON(needs) }}"
        continue-on-error: true
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
