# Local dev overrides — auto-merged by `docker compose up` (no -f flag needed).
services:
  api:
    build:
      target: dev
    command: ["uvicorn", "services.sim_bridge.app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./src:/app/src:ro
      - ./services:/app/services:ro
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      PYTHONUNBUFFERED: "1"

  web:
    build:
      target: dev
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "19104", "--strictPort"]
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
      - web-node-modules:/app/node_modules
    ports: !override
      - "${WEB_PORT:-19104}:19104"
    environment:
      VITE_BRIDGE_URL: http://api:8000
    healthcheck: !reset
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:19104/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  web-node-modules:
  verdandi-artifacts:
